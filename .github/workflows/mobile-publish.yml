name: Publier l'appli mobile (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-publish.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` (et non `npm install`) : installe EXACTEMENT le
      # package-lock.json du dépôt, sans jamais remonter un patch.
      # Les versions y sont figées pour correspondre au client Expo Go
      # installé sur les téléphones — un patch plus récent suffit à faire
      # rejeter l'update avec « Not compatible with this version of Expo Go ».
      - name: Installe les dépendances (versions figées du lock)
        run: npm ci

      # `npx expo install --fix` a été RETIRÉ ici : il réaligne les
      # versions sur ce qu'il croit être le mieux, ce qui défait
      # l'alignement précis sur le client Expo Go. Les versions sont
      # désormais résolues et vérifiées en amont, elles ne doivent plus
      # être touchées par la CI.

      - name: Installe EAS CLI
        run: npm install -g eas-cli

      - name: Lie le projet Expo existant (idempotent, sûr à répéter)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account paradoxes-app1 --non-interactive --force

      - name: Publie la mise à jour (EAS Update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        # Aucun runtimeVersion n'est forcé dans app.json : eas update
        # publie alors avec l'exposdk du SDK du projet, seule valeur
        # qu'Expo Go accepte de LANCER. Voir 63b68ff (28/08).
        run: eas update --branch main --message "Auto-publish depuis GitHub Actions (${{ github.sha }})" --non-interactive
