name: Publier l'appli mobile (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-publish.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe les dépendances
        run: npm install

      - name: Corrige les versions pour la compatibilité SDK (npx expo install a besoin d'internet
          pour vérifier les versions, ce que je n'ai pas dans mon bac à sable — mais ce robot, si)
        run: npx expo install --fix

      - name: Installe EAS CLI
        run: npm install -g eas-cli

      - name: Lie le projet Expo existant (idempotent, sûr à répéter)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account paradoxes-app1 --non-interactive --force

      - name: Publie la mise à jour (EAS Update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: eas update --branch preview --message "Auto-publish depuis GitHub Actions (${{ github.sha }})" --non-interactive
