name: Publier l'appli mobile (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-publish.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe les dépendances
        run: npm install

      - name: Installe EAS CLI
        run: npm install -g eas-cli

      - name: Publie la mise à jour (EAS Update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch preview --message "Auto-publish depuis GitHub Actions (${{ github.sha }})" --non-interactive
