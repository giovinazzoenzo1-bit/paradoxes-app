name: Publier l'appli mobile (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-publish.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` (et non `npm install`) : installe EXACTEMENT le
      # package-lock.json du dépôt, sans jamais remonter un patch.
      # Les versions y sont figées pour correspondre au client Expo Go
      # installé sur les téléphones — un patch plus récent suffit à faire
      # rejeter l'update avec « Not compatible with this version of Expo Go ».
      - name: Installe les dépendances (versions figées du lock)
        run: npm ci

      # `npx expo install --fix` a été RETIRÉ ici : il réaligne les
      # versions sur ce qu'il croit être le mieux, ce qui défait
      # l'alignement précis sur le client Expo Go. Les versions sont
      # désormais résolues et vérifiées en amont, elles ne doivent plus
      # être touchées par la CI.

      # Diagnostic : sans ça, un update publié « avec succès » mais refusé
      # par Expo Go (« Not compatible with this version of Expo Go ») est
      # impossible à expliquer depuis les logs. On veut voir noir sur
      # blanc la version d'expo réellement installée et le runtimeVersion
      # que EAS va attacher à l'update.
      - name: Diagnostic versions
        run: |
          echo "expo installé : $(node -p "require('expo/package.json').version")"
          echo "react-native  : $(node -p "require('react-native/package.json').version")"
          echo "--- config publique résolue ---"
          npx expo config --type public | grep -iE "sdkVersion|runtimeVersion|newArch" || true

      - name: Installe EAS CLI
        run: npm install -g eas-cli

      - name: Lie le projet Expo existant (idempotent, sûr à répéter)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account paradoxes-app1 --non-interactive --force

      - name: Publie la mise à jour (EAS Update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          # Le runtimeVersion résolu est mis DANS LE MESSAGE de l'update.
          # Les logs de ce robot sont stockés sur un hôte inaccessible
          # depuis l'environnement de dev, alors que le message, lui,
          # s'affiche directement dans Expo Go sur le téléphone. C'est le
          # seul canal de diagnostic qui traverse.
          EXPO_V=$(node -p "require('expo/package.json').version")
          RN_V=$(node -p "require('react-native/package.json').version")
          RT=$(npx expo config --type public --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).runtimeVersion||'(aucun)'}catch(e){'(illisible)'}")
          SDKV=$(npx expo config --type public --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).sdkVersion||'(aucun)'}catch(e){'(illisible)'}")
          eas update --branch main --non-interactive \
            --message "expo=$EXPO_V rn=$RN_V sdk=$SDKV rt=$RT" 
